appId: com.sistema.estudio-tareas
productName: Sistema Estudio y Tareas
publish:
  provider: github
  owner: TheCoders24
  repo: sistemaestudiotareas
directories:
  output: release
files:
  - "dist/**/*"
  - "electron/**/*"
  - "package.json"
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
  signExecutable: false
nsis:
  artifactName: "${productName}-${version}-setup.${ext}"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: "${productName}-${version}-portable.${ext}"
mac:
  target:
    - dmg
  artifactName: "${productName}-${version}-mac.${ext}"
  icon: build/icon.ico
linux:
  target:
    - AppImage
    - deb
    - rpm
  artifactName: "${productName}-${version}-linux.${ext}"
  icon: build/icon.ico
  category: Office
  maintainer: Sistema Estudio y Tareas <support@sistemaestudioytareas.com>
asarUnpack:
  - "**/*.node"
