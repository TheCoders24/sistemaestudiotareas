<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#c4b5fd"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="200" ry="200" fill="url(#bg)"/>
  <g transform="translate(512,512)">
    <!-- Book base -->
    <path d="M-160,-60 L160,-60 L160,140 C160,180 120,200 80,200 L-80,200 C-120,200 -160,180 -160,140 Z" fill="none" stroke="white" stroke-width="32" stroke-linejoin="round"/>
    <!-- Book spine -->
    <line x1="0" y1="-60" x2="0" y2="200" stroke="white" stroke-width="28" stroke-linecap="round"/>
    <!-- Book pages (lines) -->
    <line x1="-100" y1="20" x2="-15" y2="20" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
    <line x1="-100" y1="70" x2="-15" y2="70" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
    <line x1="-100" y1="120" x2="-15" y2="120" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
    <line x1="15" y1="20" x2="100" y2="20" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
    <line x1="15" y1="70" x2="100" y2="70" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
    <line x1="15" y1="120" x2="100" y2="120" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
    <!-- Graduation cap (mortarboard) -->
    <path d="M-180,-80 L0,-180 L180,-80 L0,20 Z" fill="white" stroke="white" stroke-width="16" stroke-linejoin="round"/>
    <path d="M-140,-60 L0,-140 L140,-60" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linejoin="round"/>
    <!-- Tassel -->
    <circle cx="160" cy="-80" r="12" fill="#f59e0b"/>
    <path d="M160,-80 Q200,-40 180,40" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <!-- Star on book -->
    <path d="M0,-120 L10,-95 L35,-95 L15,-75 L22,-50 L0,-65 L-22,-50 L-15,-75 L-35,-95 L-10,-95 Z" fill="#fbbf24" stroke="none"/>
  </g>
</svg>
